name: sih_inspector_app
description: "Geo-Locked Offline-First Mobile Inspection App for Field Auditors (MoSJE)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^10.1.0
  crypto: ^3.0.3
  sqflite: ^2.3.0
  path: ^1.9.0
  http: ^1.2.0
  intl: ^0.20.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
